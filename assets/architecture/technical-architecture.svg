<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1840" viewBox="0 0 1000 1840" role="img" aria-labelledby="title description">
<title id="title">Microsoft Hybrid Security Platform — Technical Architecture</title>
<desc id="description">One domain-joined, Entra Hybrid Joined, Intune-managed Windows 11 endpoint. AD DS on DC01 synchronizes through Entra Connect to Entra ID. Intune manages the endpoint; Defender for Endpoint and Defender for Office 365 contribute to Defender XDR. Entra Diagnostic Settings exports selected logs to yaru-sentinel-law, used by Sentinel. The Defender portal presents XDR, SIEM and exposure views and initiates endpoint response through MDE. Registration and compliance return to Entra ID. Sentinel collection is limited to Entra logs and ingestion is partial.</desc>
